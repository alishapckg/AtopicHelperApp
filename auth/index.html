    <script>(function() {
    function getThemePreference() {
        return localStorage.getItem('custom-theme') || 'auto';
    }

    function applyTheme(themeID) {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const lightThemeID = document.documentElement.getAttribute('data-light-theme') || 'light';
        const darkThemeID = document.documentElement.getAttribute('data-dark-theme') || 'dark';
        const actualThemeID = themeID === 'auto' ? (prefersDark ? darkThemeID : lightThemeID) : themeID;

        document.documentElement.setAttribute('data-bs-theme', actualThemeID);
        document.documentElement.setAttribute('data-theme-state', themeID);
    }

    function applySyntaxTheme() {
        const syntaxTheme = getComputedStyle(document.documentElement)
            .getPropertyValue('--syntax-highlight-theme').trim().replace(/"/g, '');

        if (!syntaxTheme) return;

        document.querySelectorAll('link[data-highlight-theme]').forEach(link => {
            link.setAttribute('disabled', 'disabled');
        });

        const themeLink = document.querySelector(`link[data-highlight-theme="${syntaxTheme}"]`);
        if (themeLink) {
            themeLink.removeAttribute('disabled');
        }
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        const currentTheme = getThemePreference();
        if (currentTheme === 'auto') {
            applyTheme('auto');
            applySyntaxTheme();
        }
    });

    const savedTheme = getThemePreference();
    applyTheme(savedTheme);
    applySyntaxTheme();
})();
</script>

      <script>
    (function() {
      var currentMode = 'login';

      function switchMode(m) {
        currentMode = m;
        var pill     = document.getElementById('tabPill');
        var tl       = document.getElementById('tabLogin');
        var ts       = document.getElementById('tabSignup');
        var label    = document.getElementById('authBtnLabel');
        var ftxt     = document.getElementById('footerText');
        var flink    = document.getElementById('footerLink');
        var msg      = document.getElementById('authMsg');
        var authF    = document.getElementById('authFields');
        var forgotF  = document.getElementById('forgotFields');
        var confirmG = document.getElementById('confirmEmailGroup');
        var forgotL  = document.getElementById('forgotLink');
        msg.className = 'auth-msg';

        if (m === 'forgot') {
          authF.style.display   = 'none';
          forgotF.style.display = 'block';
          tl.classList.remove('active'); ts.classList.remove('active');
          label.textContent = 'Send reset link';
          ftxt.textContent  = 'Remember it?';
          flink.textContent = ' Back to log in';
          flink.onclick = function() { switchMode('login'); };
          return;
        }

        authF.style.display   = 'block';
        forgotF.style.display = 'none';

        if (m === 'signup') {
          pill.classList.add('right');
          tl.classList.remove('active'); ts.classList.add('active');
          confirmG.classList.add('visible');
          if (forgotL) forgotL.style.display = 'none';
          label.textContent = 'Create account';
          ftxt.textContent  = 'Already have an account?';
          flink.textContent = ' Log in';
          flink.onclick = function() { switchMode('login'); };
        } else {
          pill.classList.remove('right');
          tl.classList.add('active'); ts.classList.remove('active');
          confirmG.classList.remove('visible');
          if (forgotL) forgotL.style.display = 'block';
          label.textContent = 'Log in';
          ftxt.textContent  = 'No account?';
          flink.textContent = ' Sign up for free';
          flink.onclick = function() { switchMode('signup'); };
        }

        var fields = document.getElementById('authFields');
        fields.style.animation = 'none';
        void fields.offsetWidth;
        fields.style.animation = '';
      }

      function showMessage(text, type) {
        var el = document.getElementById('authMsg');
        el.className = 'auth-msg';
        void el.offsetWidth;
        var icon = type === 'error' ? '⚠ ' : type === 'success' ? '✓ ' : 'ℹ ';
        el.textContent = icon + text;
        el.className = 'auth-msg ' + type;
      }

      async function handleSubmit() {
        if (currentMode === 'forgot') { await handleForgotPassword(); return; }

        var email     = document.getElementById('authEmail').value.trim();
        var emailConf = document.getElementById('authEmailConfirm').value.trim();
        var pass      = document.getElementById('authPass').value;

        if (currentMode === 'signup' && email !== emailConf) {
          document.getElementById('authEmailConfirm').classList.add('error-field');
          showMessage('Email addresses do not match. Please check and try again.', 'error');
          return;
        }
        document.getElementById('authEmailConfirm').classList.remove('error-field');

        if (!email || pass.length < 6) {
          showMessage('Please fill in all fields (password: 6+ characters).', 'error');
          return;
        }

        var btn     = document.getElementById('authSubmit');
        var spinner = document.getElementById('authSpinner');
        var label   = document.getElementById('authBtnLabel');
        btn.disabled = true;
        spinner.style.display = 'block';
        label.textContent = 'Loading…';

        try {
          var result;
          if (currentMode === 'login') {
            result = await window.SupabaseAuth.signIn(email, pass);
          } else {
            result = await window.SupabaseAuth.signUp(email, pass);
          }
          if (result.error) throw result.error;

          showMessage(currentMode === 'login' ? 'Welcome back! Redirecting…' : 'Account created! Redirecting…', 'success');
          var redirect = new URLSearchParams(window.location.search).get('redirect') || '/AtopicHelperApp/';
          setTimeout(function() { window.location.href = redirect; }, 900);
        } catch (err) {
          console.error('Auth error:', err);
          showMessage(err.message || 'Something went wrong. Please try again.', 'error');
          btn.disabled = false;
          spinner.style.display = 'none';
          label.textContent = currentMode === 'login' ? 'Log in' : 'Create account';
        }
      }

      async function handleForgotPassword() {
        var email = document.getElementById('forgotEmail').value.trim();
        if (!email) { showMessage('Please enter your email address.', 'error'); return; }

        var btn     = document.getElementById('authSubmit');
        var spinner = document.getElementById('authSpinner');
        var label   = document.getElementById('authBtnLabel');
        btn.disabled = true;
        spinner.style.display = 'block';
        label.textContent = 'Sending…';

        try {
          var res = await window.supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: 'https://alishapckg.github.io/AtopicHelperApp/'
          });
          if (res.error) throw res.error;
          showMessage('Reset link sent! Check your inbox (and spam folder).', 'success');
        } catch (err) {
          showMessage(err.message || 'Failed to send reset email. Try again.', 'error');
        } finally {
          btn.disabled = false;
          spinner.style.display = 'none';
          label.textContent = 'Send reset link';
        }
      }

      document.getElementById('authSubmit').addEventListener('click', handleSubmit);
      document.getElementById('authPass').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleSubmit();
      });
      document.getElementById('footerLink').onclick = function() { switchMode('signup'); };
      window.switchMode = switchMode;

      document.addEventListener('DOMContentLoaded', async function() {
        if (typeof window.SupabaseAuth === 'undefined') return;
        var s = await window.SupabaseAuth.getSession();
        if (s && s.session && s.session.user) {
          window.location.href = new URLSearchParams(window.location.search).get('redirect') || '/AtopicHelperApp/';
        }
      });
    })();
  </script>
    </div>
    <script src="/AtopicHelperApp/supabase-config.js"></script>
    <script>  function setActiveNav() {
    var path = window.location.pathname;
    document.querySelectorAll('#top-bar-nav a').forEach(function(a) {
      a.classList.toggle('active', a.getAttribute('href') === path);
    });
  }

  async function updateAuthUI() {
    if (typeof window.SupabaseAuth === 'undefined') {
      setTimeout(updateAuthUI, 100);
      return;
    }
    const { session } = await window.SupabaseAuth.getSession();
    const guestUI = document.getElementById('guest-ui');
    const userUI  = document.getElementById('user-ui');
    const nav     = document.getElementById('top-bar-nav');
    const emailEl = document.getElementById('user-email');

    if (session && session.user) {
      guestUI.style.display = 'none';
      userUI.style.display  = 'flex';
      nav.classList.add('visible');
      emailEl.textContent = session.user.email.split('@')[0];
    } else {
      guestUI.style.display = 'block';
      userUI.style.display  = 'none';
      nav.classList.remove('visible');
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    setActiveNav();
    updateAuthUI();

    var logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', async function() {
        await window.SupabaseAuth.signOut();
        window.location.href = '/AtopicHelperApp/auth';
      });
    }
  });</script>

    <script src="/js/ignite-core.js"></script>
